name: Build Tico Limiter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Create NSIS installer
        shell: pwsh
        run: |
          # Write NSIS script
          @'
          !define PRODUCT_NAME "Tico Limiter"
          !define PRODUCT_PUBLISHER "MiDiCat"
          !define PRODUCT_VERSION "5.2.1"

          Name "${PRODUCT_NAME} ${PRODUCT_VERSION}"
          OutFile "TicoLimiter-Setup.exe"
          InstallDir "$COMMONFILES\VST3"
          InstallDirRegKey HKLM "Software\${PRODUCT_NAME}" "InstallDir"
          RequestExecutionLevel admin

          !include "MUI2.nsh"

          !define MUI_ABORTWARNING

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "English"
          !insertmacro MUI_LANGUAGE "SimpChinese"

          Section "VST3 Plugin" SecVST3
            SectionIn RO
            SetOutPath "$INSTDIR"
            File /r "build\TicoLimiter_artefacts\Release\VST3\${PRODUCT_NAME}.vst3"
            WriteRegStr HKLM "Software\${PRODUCT_NAME}" "InstallDir" "$INSTDIR"
            WriteUninstaller "$INSTDIR\${PRODUCT_NAME}\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            RMDir /r "$COMMONFILES\VST3\${PRODUCT_NAME}.vst3"
            RMDir /r "$INSTDIR\${PRODUCT_NAME}"
            DeleteRegKey HKLM "Software\${PRODUCT_NAME}"
          SectionEnd
          '@ | Out-File -Encoding ASCII installer.nsi

          # Build installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicoLimiter-Windows
          path: TicoLimiter-Setup.exe

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TicoLimiter-Windows/TicoLimiter-Setup.exe
          generate_release_notes: true
